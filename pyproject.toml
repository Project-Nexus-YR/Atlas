[project]
name = "atlas"
version = "0.1.0"
description = "Research Platform for Adaptive Long-Term Memory in Autonomous Software Engineering"
authors = [
    { name = "Atlas Research Team" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "wandb>=0.17.0",
    "qdrant-client>=1.9.1",
    "neo4j>=5.20.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true
