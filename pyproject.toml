[project]
name = "atlas"
version = "0.2.0"
description = "Measures whether an evolving knowledge graph retrieves better context for a lifelong software-engineering agent than vector similarity search."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Yasser Ameur" }]
keywords = ["agent-memory", "spreading-activation", "retrieval", "benchmark"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy>=2.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
graph = ["neo4j>=5.20"]
tracking = ["wandb>=0.18"]
swebench = ["datasets>=3.0"]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
Source = "https://github.com/Project-Nexus-YR/Atlas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RET", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["neo4j.*", "wandb.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
